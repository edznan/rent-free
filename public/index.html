<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RentFree</title>
    <meta name="description" content="Napravi CV u pregledniku i izvezi ga u PDF. Podaci ostaju na tvom uređaju." />
    <meta name="theme-color" content="#009688" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RentFree" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <style>
        :root {
            --bg: #f3f5f7;
            --card: #fff;
            --ink: #18202a;
            --muted: #64748b;
            --line: #e4e8ec;
            --accent: #009688;
            --danger: #dc2626;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        button,
        a {
            font: inherit;
        }

        #shell {
            max-width: 560px;
            margin: 0 auto;
            padding: 18px 16px calc(92px + env(safe-area-inset-bottom));
        }

        .screen-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .screen-head h1 {
            font-size: 20px;
            margin: 0;
            flex: 1;
        }

        .head-sub {
            font-size: 12px;
            color: var(--muted);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 14px;
        }

        .card h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--muted);
            margin: 0 0 12px;
        }

        .card h2 .count {
            float: right;
            font-weight: 400;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            background: #fff;
            color: var(--ink);
        }

        .input:focus {
            outline: 2px solid var(--accent);
            border-color: var(--accent);
        }

        textarea.input {
            resize: vertical;
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .row3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-danger {
            color: var(--danger);
            border-color: #fecaca;
            background: #fff;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 10px;
        }

        .btn-block {
            width: 100%;
        }

        .btnrow {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .iconbtn {
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: var(--ink);
            cursor: pointer;
            flex: none;
        }

        .entry {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            background: #fbfcfd;
        }

        .entry-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .empty {
            text-align: center;
            padding: 44px 20px;
            color: var(--muted);
        }

        .empty .fa {
            font-size: 34px;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .resume-row .meta {
            font-size: 12px;
            color: var(--muted);
            margin: 2px 0 10px;
        }

        .resume-row .nm {
            font-weight: 700;
        }

        .fontopt {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            background: #fff;
        }

        .fontopt.on {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .fontopt .sample {
            font-size: 20px;
        }

        .swatches {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .swatch {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px var(--line);
            cursor: pointer;
            padding: 0;
        }

        .swatch.on {
            box-shadow: 0 0 0 2px var(--accent);
        }

        .colorrow {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .colorrow input[type=color] {
            width: 34px;
            height: 34px;
            border: 1px solid var(--line);
            border-radius: 50%;
            padding: 2px;
            background: #fff;
            cursor: pointer;
        }

        details.more {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--card);
            margin-bottom: 14px;
        }

        /* ---------- icon picker ---------- */
        .iconpick {
            position: relative;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .iconpick .input {
            flex: 1;
            min-width: 0;
        }

        .iconpick-toggle {
            flex: none;
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .iconpick.open .iconpick-toggle {
            border-color: var(--accent);
            color: var(--accent);
        }

        .iconpick-menu {
            position: absolute;
            z-index: 40;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .18);
            padding: 10px;
            max-height: 244px;
            overflow: auto;
        }

        .iconpick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
            gap: 6px;
        }

        .iconpick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 4px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #fbfcfd;
            color: var(--muted);
            font: inherit;
            font-size: 9px;
            line-height: 1.1;
            cursor: pointer;
            overflow: hidden;
        }

        .iconpick-item span {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .iconpick-item .fa {
            font-size: 17px;
            color: var(--ink);
        }

        .iconpick-item:hover,
        .iconpick-item:focus-visible {
            border-color: var(--accent);
            background: #fff;
            outline: none;
        }

        .iconpick-item.on {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
            background: #fff;
        }

        .iconpick-item.on .fa {
            color: var(--accent);
        }

        .iconpick-empty {
            padding: 12px 6px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        /* a label sitting next to an inline action, e.g. the bullet button */
        .field-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .field-head label {
            margin-bottom: 0;
        }

        details.more>summary {
            cursor: pointer;
            padding: 14px 16px;
            font-weight: 600;
            color: var(--muted);
            list-style: none;
        }

        details.more>summary::-webkit-details-marker {
            display: none;
        }

        details.more>summary::after {
            content: "\f078";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 11px;
            float: right;
            color: var(--accent);
        }

        details.more[open]>summary::after {
            content: "\f077";
        }

        details.more>.inner {
            padding: 0 16px 16px;
        }

        .pv-holder {
            width: 100%;
        }

        #pvScale {
            transform-origin: top left;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
            background: #fff;
            width: 794px;
        }

        #pv {
            border: 0;
            width: 794px;
            display: block;
            background: #fff;
            height: -webkit-fill-available;
        }

        .tabbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            border-top: 1px solid var(--line);
            z-index: 20;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        }

        .tabbar-inner {
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }

        .tabbar a,
        .tabbar .tab-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-width: 58px;
            padding: 4px 6px;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            border-radius: 12px;
            background: none;
            border: none;
            font-family: inherit;
            cursor: pointer;
        }

        .tabbar a .fa,
        .tabbar .tab-link .fa {
            font-size: 19px;
        }

        .tabbar a.active,
        .tabbar .tab-link.active {
            color: var(--accent);
        }

        /* ---------- secondary sidebar (drawer) ---------- */
        .drawer {
            position: fixed;
            inset: 0;
            z-index: 50;
        }

        .drawer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(12, 18, 24, .45);
            opacity: 0;
            transition: opacity .2s ease;
        }

        .drawer-panel {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(320px, 86vw);
            background: var(--card);
            box-shadow: -4px 0 28px rgba(0, 0, 0, .22);
            padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transform: translateX(102%);
            transition: transform .24s ease;
        }

        .drawer.open .drawer-backdrop {
            opacity: 1;
        }

        .drawer.open .drawer-panel {
            transform: translateX(0);
        }

        .drawer-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .drawer-head h2 {
            flex: 1;
            margin: 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--muted);
        }

        .drawer-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .drawer-nav>button,
        .drawer-nav>a {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 13px 12px;
            border: none;
            border-radius: 12px;
            background: none;
            color: var(--ink);
            font: inherit;
            font-weight: 600;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
        }

        .drawer-nav>button:hover,
        .drawer-nav>a:hover {
            background: var(--bg);
        }

        .drawer-nav .fa {
            width: 20px;
            text-align: center;
            color: var(--accent);
            font-size: 16px;
        }

        .drawer-foot {
            margin: auto 0 0;
            padding-top: 14px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        /* ---------- template picker ---------- */
        .tpl-hint {
            margin: -6px 0 14px;
            font-size: 12.5px;
            line-height: 1.45;
            color: var(--muted);
        }

        .tpl-group {
            margin-bottom: 16px;
        }

        .tpl-group-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .tpl-group-name {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--accent);
        }

        .tpl-group-desc {
            font-size: 11px;
            color: var(--muted);
            text-align: right;
        }

        .tpl-badge {
            display: inline-block;
            margin-left: 4px;
            padding: 1px 6px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            vertical-align: middle;
        }

        .tpl-toggle {
            width: 100%;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .tpl-toggle.on {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .tpl-toggle-caret {
            color: var(--muted);
            font-size: 11px;
        }

        .tpl-panel {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--card);
            padding: 12px 12px 4px;
            margin-bottom: 12px;
        }

        .tpl-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 2px 2px 6px;
            scroll-snap-type: x proximity;
        }

        .tpl-card {
            flex: 0 0 188px;
            scroll-snap-align: start;
            display: block;
            text-align: left;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            color: var(--ink);
            font: inherit;
            cursor: pointer;
        }

        .tpl-card.on {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
            background: #fafdfc;
        }

        .tpl-name {
            display: block;
            font-weight: 700;
            font-size: 13px;
        }

        .tpl-card.on .tpl-name {
            color: var(--accent);
        }

        .tpl-desc {
            display: block;
            margin-top: 4px;
            font-size: 11.5px;
            line-height: 1.35;
            color: var(--muted);
        }

        /* secondary screens */
        .doc-updated {
            margin: 0 0 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .doc-h {
            font-size: 14px;
            color: var(--ink);
            margin: 20px 0 6px;
        }

        .doc-h:first-child {
            margin-top: 0;
        }

        .info-ul {
            margin: 0 0 12px;
            padding-left: 20px;
            color: var(--ink);
            line-height: 1.55;
        }

        .info-ul li {
            margin-bottom: 6px;
        }

        .support-way {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            margin-bottom: 8px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
        }

        .support-way:last-child {
            margin-bottom: 0;
        }

        .support-way .fa {
            color: var(--accent);
            font-size: 16px;
        }

        .support-way .hint {
            margin-left: auto;
            font-size: 12px;
            color: var(--muted);
        }

        .support-sep {
            border: 0;
            border-top: 1px solid var(--line);
            margin: 12px 0;
        }

        .support-way.static {
            background: #fbfcfd;
        }

        .card.install h2 {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
        }

        .info-p {
            color: var(--ink);
            line-height: 1.55;
        }

        .info-p:last-child {
            margin-bottom: 0;
        }

        .tabbar .plus {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 20px;
            margin-top: -20px;
            border: none;
            box-shadow: 0 6px 16px rgba(0, 150, 136, .35);
            cursor: pointer;
        }

        #toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(96px + env(safe-area-inset-bottom));
            background: #18202a;
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 30;
            max-width: 90vw;
        }

        #toast.show {
            opacity: .95;
        }

        .saved {
            font-size: 12px;
            color: var(--muted);
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div id="shell">
        <div id="app"></div>
    </div>

    <nav class="tabbar">
        <div class="tabbar-inner">
            <a href="#/" data-tab="/"><i class="fa-solid fa-house"></i><span data-i18n="nav.home">Home</span></a>
            <a href="#/settings" data-tab="/settings"><i class="fa-solid fa-sliders"></i><span data-i18n="nav.settings">Settings</span></a>
            <button class="plus" id="tabPlus" title="New resume" data-i18n-title="nav.new"><i class="fa-solid fa-plus"></i></button>
            <a href="#/account" data-tab="/account"><i class="fa-solid fa-user"></i><span data-i18n="nav.account">Account</span></a>
             <button class="tab-link" id="tabMore" type="button" aria-expanded="false" aria-controls="drawer">
                <i class="fa-solid fa-bars"></i><span data-i18n="nav.more">More</span></button>
        </div>
    </nav>

    <!-- Secondary features live here, off the main path. -->
    <div id="drawer" class="drawer" hidden>
        <div class="drawer-backdrop" data-drawer-close></div>
        <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="More">
            <div class="drawer-head">
                <h2 data-i18n="drawer.title">More</h2>
                <button class="iconbtn" data-drawer-close aria-label="Close" data-i18n-aria="drawer.close">
                    <i class="fa-solid fa-xmark"></i></button>
            </div>
            <nav class="drawer-nav">
                <button type="button" data-goto="/about"><i class="fa-solid fa-circle-info"></i><span data-i18n="drawer.about">About</span></button>
                <button type="button" data-goto="/contact"><i class="fa-solid fa-paper-plane"></i><span data-i18n="drawer.contact">Contact</span></button>
                <button type="button" data-goto="/support"><i class="fa-solid fa-mug-hot"></i><span data-i18n="drawer.support">Support the project</span></button>
                <button type="button" data-goto="/terms"><i class="fa-solid fa-file-lines"></i><span data-i18n="drawer.terms">Terms of use</span></button>
                <button type="button" data-goto="/privacy"><i class="fa-solid fa-shield-halved"></i><span data-i18n="drawer.privacy">Privacy</span></button>
                <button type="button" id="drawerInstall" hidden><i class="fa-solid fa-mobile-screen"></i><span data-i18n="install.action">Install app</span></button>
            </nav>
            <p class="drawer-foot" data-i18n="home.localOnly">Everything stays on this device.</p>
        </aside>
    </div>

    <div id="toast"></div>

    <script src="i18n.js"></script>
    <script src="content.js"></script>
    <script src="template.js"></script>
    <script>
        /* ================================================================
           storage
        ================================================================ */
        const LS = {
            get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
            set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
            del(k) { localStorage.removeItem(k); },
        };
        const K = {
            settings: "rr:settings",
            resumes: "rr:resumes",
            resume: (id) => "rr:resume:" + id,
            account: "rr:account",
            active: "rr:active",
        };
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const $ = (s, r) => (r || document).querySelector(s);
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        /* ================================================================
           i18n — one language for the whole app, kept in settings so the
           renderer (and therefore the PDF) uses the same one.
        ================================================================ */
        /* One language for the whole app; it drives the interface AND the
           section labels printed on the CV. English unless the user picks otherwise. */
        let LANG = I18n.DEFAULT_LANG;
        const t = (key, vars) => I18n.t(LANG, key, vars);   // read at call time, hot-swappable
        const tn = (key, n) => I18n.tn(LANG, key, n);

        const DEFAULT_SETTINGS = { font: "inter", accent: "#009688", sideBg: "#212529", multipage: false,
                                   lang: I18n.DEFAULT_LANG };
        const ACCENT_PRESETS = ["#009688", "#2563eb", "#7c3aed", "#dc2626", "#ea580c"];
        const SIDE_PRESETS = ["#212529", "#1e293b", "#37474f", "#111827", "#312e81"];
        const FONTS = RenderResume.FONTS;

        const getSettings = () => ({ ...DEFAULT_SETTINGS, ...LS.get(K.settings, {}) });
        const saveSettings = (s) => LS.set(K.settings, s);
        const getAccount = () => LS.get(K.account, { name: "", email: "" });
        const saveAccount = (a) => LS.set(K.account, a);

        /* One place that changes the language: settings -> UI -> every resume label. */
        function setLang(code) {
            LANG = I18n.normalizeLang(code);
            saveSettings({ ...getSettings(), lang: LANG });
            applyI18n();
            renderRoute();
        }

        /* Static markup (tab bar, document title) is translated from data-i18n attrs;
           everything else is generated through t() inside the screens. */
        LANG = I18n.normalizeLang(getSettings().lang);

        function applyI18n() {
            document.documentElement.lang = LANG;
            document.title = t("app.title");
            document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
            document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
        }

        /* ================================================================
           resume model
        ================================================================ */
        function normalize(r) {
            r.contact ||= {}; r.education ||= []; r.experience ||= []; r.skills ||= [];
            r.languages ||= []; r.hobbies ||= []; r.license ||= "";
            r.extraSidebar ||= []; r.extraMain ||= []; r.photo ||= ""; r.summary ||= ""; r.role ||= "";
            r.template ||= RenderResume.DEFAULT_TEMPLATE; // presentation only, never the data itself
            r.experience.forEach((e) => { e.tags ||= []; });
            return r;
        }
        function blankResume() {
            const a = getAccount();
            return normalize({
                id: uid(), name: a.name || "", role: "",
                contact: { phone: "", email: a.email || "", address: "" },
                createdAt: Date.now(), updatedAt: Date.now(),
            });
        }
        const listResumes = () => LS.get(K.resumes, []).sort((a, b) => b.updatedAt - a.updatedAt);
        const getResume = (id) => { const r = LS.get(K.resume(id), null); return r ? normalize(r) : null; };
        function putResume(r) {
            r.updatedAt = Date.now();
            LS.set(K.resume(r.id), r);
            const idx = LS.get(K.resumes, []);
            const meta = { id: r.id, name: r.name, role: r.role, updatedAt: r.updatedAt };
            const i = idx.findIndex((x) => x.id === r.id);
            i >= 0 ? (idx[i] = meta) : idx.push(meta);
            LS.set(K.resumes, idx);
        }
        function delResume(id) {
            LS.del(K.resume(id));
            LS.set(K.resumes, LS.get(K.resumes, []).filter((x) => x.id !== id));
            if (getActive() === id) setActive(null);
        }
        const setActive = (id) => LS.set(K.active, id);
        const getActive = () => LS.get(K.active, null);

        /* ================================================================
           drafts
           "New" must not litter the list with empty resumes, so a fresh
           resume lives in memory only and is written on the first edit.
        ================================================================ */
        let draft = null;

        /** True when a resume holds nothing worth keeping. */
        function isBlank(r) {
            const txt = (v) => String(v ?? "").trim();
            const anyLine = (arr) => (arr || []).some((s) => txt(s.title) || (s.lines || []).some(txt));
            return !txt(r.name) && !txt(r.role) && !txt(r.summary) && !txt(r.license) && !txt(r.photo)
                && !txt(r.contact && r.contact.phone) && !txt(r.contact && r.contact.email) && !txt(r.contact && r.contact.address)
                && !(r.education || []).some((e) => txt(e.degree) || txt(e.school))
                && !(r.experience || []).some((e) => txt(e.role) || txt(e.company) || txt(e.period) || txt(e.description))
                && !(r.skills || []).some(txt)
                && !(r.languages || []).some((l) => txt(l.name) || txt(l.level))
                && !(r.hobbies || []).some((h) => txt(h.label))
                && !anyLine(r.extraSidebar) && !anyLine(r.extraMain);
        }

        /** "New resume" — pick a template first, then start filling the form. */
        function newResume() {
            navigate("/new");
        }

        /** A template was chosen: open the editor with it. An unsaved draft
            keeps whatever was already typed; only its template changes. */
        function startResume(templateId) {
            if (!draft) draft = blankResume();
            draft.template = RenderResume.normalizeTemplate(templateId);
            setActive(null);
            navigate("/form");
        }

        /** The resume currently being edited: a saved one, or the in-memory draft. */
        function currentResume() {
            const saved = getActive() && getResume(getActive());
            if (saved) { draft = null; return saved; }
            if (!draft) draft = blankResume();
            return draft;
        }

        const merged = (r) => ({ ...r, ...getSettings() }); // settings applied at render time

        function timeAgo(ts) {
            const s = (Date.now() - ts) / 1000;
            if (s < 60) return t("time.now");
            if (s < 3600) return t("time.min", { n: Math.floor(s / 60) });
            if (s < 86400) return t("time.hour", { n: Math.floor(s / 3600) });
            if (s < 2592000) return t("time.day", { n: Math.floor(s / 86400) });
            return new Date(ts).toLocaleDateString(I18n.locale(LANG));
        }
        const updatedText = (ts) => t("time.updated", { when: timeAgo(ts) });
        const slug = (s) => (s || "resume").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") || "resume";

        /* one-time migration from the v2 single-resume key */
        (function migrateLegacy() {
            if (LS.get(K.resumes, null)) return;
            const raw = localStorage.getItem("resume-data");
            if (!raw) return;
            try {
                const o = JSON.parse(raw);
                const r = normalize({
                    id: uid(), name: o.name || "", role: o.role || "", photo: o.photo || "",
                    summary: (o.summary && o.summary.text) || "",
                    contact: {
                        phone: (o.contact && o.contact.phone) || "", email: (o.contact && o.contact.email) || "",
                        address: (o.contact && o.contact.address) || "",
                    },
                    education: (o.education && o.education.items) || [],
                    experience: (o.experience && o.experience.items) || [],
                    skills: (o.skills && o.skills.items) || [],
                    languages: (o.languages && o.languages.items) || [],
                    hobbies: (o.hobbies && o.hobbies.items) || [],
                    license: (o.license && o.license.category) || "",
                    extraSidebar: o.extraSidebar || [], extraMain: o.extraMain || [],
                    createdAt: Date.now(), updatedAt: Date.now(),
                });
                putResume(r); setActive(r.id);
                saveSettings({
                    ...DEFAULT_SETTINGS, accent: o.accent || DEFAULT_SETTINGS.accent,
                    sideBg: o.sideBg || DEFAULT_SETTINGS.sideBg, multipage: !!o.multipage
                });
                toast(t("migrate.imported"));
            } catch { }
        })();

        /* ================================================================
           helpers: paths, toast, pdf
        ================================================================ */
        function setPath(obj, path, val) {
            const ks = path.split("."); let o = obj;
            for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
            o[ks[ks.length - 1]] = val;
        }
        function getPath(obj, path) {
            return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
        }
        let toastT;
        function toast(msg) {
            const t = $("#toast"); t.textContent = msg; t.classList.add("show");
            clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
        }
        /* ================================================================
           PDF export — no backend: the browser prints the preview to PDF.
           The resume template is already A4 (@page size A4, margin 0), so
           "Save as PDF" gives exactly what the preview shows.
        ================================================================ */
        function printResume() {
            const pv = $("#pv");
            if (pv && pv.contentWindow) {
                try {
                    pv.contentWindow.focus();
                    pv.contentWindow.print();
                    toast(t("print.hint"));
                    return;
                } catch { /* fall through to a tab */ }
            }
            openResumeTab();
        }

        /* Fallback for browsers that refuse to print a frame: same document,
           its own tab, where the user can print or share it. */
        function openResumeTab() {
            const r = currentResume();
            const w = window.open("", "_blank");
            if (!w) { toast(t("print.blocked")); return; }
            w.document.open();
            w.document.write(RenderResume.render(merged(r)));
            w.document.close();
            w.addEventListener("load", () => setTimeout(() => { try { w.focus(); w.print(); } catch { /* user can print manually */ } }, 500));
        }

        /* ================================================================
           router (canonical — this block must exist exactly once)
        ================================================================ */
        const routes = {
            "/": ScreenHome,
            "/new": ScreenNew,
            "/form": ScreenForm,
            "/preview": ScreenPreview,
            "/settings": ScreenSettings,
            "/account": ScreenAccount,
            /* secondary screens, reached from the sidebar */
            "/about": ScreenAbout,
            "/contact": ScreenContact,
            "/support": ScreenSupport,
            "/terms": ScreenDoc("terms"),
            "/privacy": ScreenDoc("privacy"),
        };

        const currentPath = () => ((location.hash || "#/").slice(1).split("?")[0]) || "/";

        function navigate(p) {
            closeDrawer();
            if (currentPath() === p) renderRoute(); // re-render even if hash won't change
            else location.hash = "#" + p;
        }

        /* Mount = render into a FRESH #app clone, so listeners can never stack
           and old screens can never leak handlers into new ones. */
        function mount(view) {
            const old = $("#app");
            const app = old.cloneNode(false); // empty node, same id, zero listeners
            old.parentNode.replaceChild(app, old);
            app.innerHTML = view.html();
            if (view.bind) view.bind();
        }

        /* ================================================================
           secondary sidebar ("More")
           Site identity and links live in content.js (SITE).
        ================================================================ */
        const SECONDARY = ["/about", "/contact", "/support", "/terms", "/privacy"];
        const drawerOpen = () => { const d = $("#drawer"); return !!d && d.classList.contains("open"); };

        function openDrawer() {
            const d = $("#drawer");
            if (!d) return;
            const row = $("#drawerInstall");
            if (row) row.hidden = !canInstall();
            d.hidden = false;
            requestAnimationFrame(() => d.classList.add("open")); // let the transition run
            $("#tabMore").setAttribute("aria-expanded", "true");
            $("#tabMore").classList.add("active");
        }

        function closeDrawer() {
            const d = $("#drawer");
            if (!d || d.hidden) return;
            d.classList.remove("open");
            $("#tabMore").setAttribute("aria-expanded", "false");
            $("#tabMore").classList.toggle("active", SECONDARY.includes(currentPath()));
            setTimeout(() => { if (!d.classList.contains("open")) d.hidden = true; }, 240);
        }

        $("#tabMore").addEventListener("click", () => (drawerOpen() ? closeDrawer() : openDrawer()));
        $("#drawer").addEventListener("click", (e) => {
            if (e.target.closest("[data-drawer-close]")) { closeDrawer(); return; }
            if (e.target.closest("#drawerInstall")) { promptInstall(); return; }
            const go = e.target.closest("[data-goto]");
            if (go) navigate(go.dataset.goto);
        });
        addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

        /* ================================================================
           installable app (PWA)
           Chromium fires beforeinstallprompt and we replay it on our own
           button; iOS Safari has no such event, so it gets instructions.
        ================================================================ */
        let installEvent = null;
        const isStandalone = () =>
            matchMedia("(display-mode: standalone)").matches ||
            matchMedia("(display-mode: fullscreen)").matches ||
            navigator.standalone === true;
        const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
        const installDismissed = () => LS.get("rr:installHidden", false);
        /* Worth offering when it can actually be installed and is not already. */
        const canInstall = () => !isStandalone() && !installDismissed() && (!!installEvent || isIOS());

        addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();           // keep the mini-infobar away, we ask ourselves
            installEvent = e;
            renderRoute();
        });
        addEventListener("appinstalled", () => {
            installEvent = null;
            toast(t("install.done"));
            renderRoute();
        });

        async function promptInstall() {
            if (installEvent) {
                installEvent.prompt();
                try {
                    const { outcome } = await installEvent.userChoice;
                    if (outcome === "accepted") installEvent = null;
                } catch { /* older browsers resolve nothing */ }
                installEvent = null;
                renderRoute();
                return;
            }
            if (isIOS()) { toast(t("install.iosBody")); return; }
            toast(t("install.unavailable"));
        }

        function hideInstall() {
            LS.set("rr:installHidden", true);
            renderRoute();
        }

        /* Banner shown on Home while the app can still be installed. */
        function installCard() {
            if (!canInstall()) return "";
            return `
            <div class="card install">
              <h2><i class="fa-solid fa-mobile-screen"></i> ${t("install.title")}</h2>
              <p class="info-p">${t(isIOS() && !installEvent ? "install.iosBody" : "install.body")}</p>
              <div class="btnrow">
                ${installEvent ? `<button class="btn btn-primary btn-sm" data-install>
                    <i class="fa-solid fa-download"></i> ${t("install.cta")}</button>` : ""}
                <button class="btn btn-sm" data-install-hide>${t("install.later")}</button>
              </div>
            </div>`;
        }

        function errorCard(err) {
            const old = $("#app");
            const app = old.cloneNode(false);
            old.parentNode.replaceChild(app, old);
            app.innerHTML = `<div class="card"><h2>${t("app.error.title")}</h2>
    <p style="font-family:monospace;font-size:12px;white-space:pre-wrap">${esc(String((err && err.stack) || err))}</p>
    <button class="btn" onclick="location.hash='#/'">${t("app.error.home")}</button></div>`;
        }

        function renderRoute() {
            const path = currentPath();
            closeDrawer(); // any navigation dismisses the sidebar, tab-bar links included
            if (path !== "/preview") tplPickerOpen = false;
            document.querySelectorAll("[data-tab]").forEach((a) =>
                a.classList.toggle("active", a.dataset.tab === path));
            /* "More" owns the secondary screens, so keep it lit while you are on one */
            const more = $("#tabMore");
            if (more) more.classList.toggle("active", SECONDARY.includes(path) || drawerOpen());
            try {
                const screen = routes[path] || ScreenHome;
                mount(screen()); // ← call the factory; it RETURNS { html, bind }
            } catch (err) {
                console.error("[router]", path, err);
                errorCard(err); // never get silently stuck again — errors become visible
            }
            window.scrollTo(0, 0);
        }

        addEventListener("hashchange", renderRoute);

        /* If you tap the tab you're already on, the hash doesn't change and no
           hashchange fires — force a re-render so the screen is always fresh. */
        document.querySelector(".tabbar").addEventListener("click", (e) => {
            const a = e.target.closest("a[href^='#/']");
            if (a && a.getAttribute("href") === location.hash) renderRoute();
        });

        $("#tabPlus").addEventListener("click", () => newResume());

        /* ================================================================
           screen: home — the resume list (the old separate "my resumes"
           screen was the same page twice, so it is gone)
        ================================================================ */
        function ScreenHome() {
            return {
                html() {
                    const a = getAccount(), rs = listResumes();
                    if (!rs.length) return `
            <div class="screen-head"><h1>${t("home.title")}</h1></div>
            <div class="card"><div class="empty">
              <div><i class="fa-solid fa-file-lines fa"></i></div>
              <p><b>${t("home.welcome")}${a.name ? ", " + esc(a.name) : ""}.</b><br>${t("home.welcomeSub")}</p>
              <button class="btn btn-primary btn-block" data-new>
                <i class="fa-solid fa-plus"></i> ${t("home.create")}</button>
            </div></div>
            ${installCard()}
            <p class="footer-note">${t("home.localOnly")}</p>`;

                    return `
            <div class="screen-head"><h1>${t("home.title")}</h1>
              <span class="head-sub">${tn("home.count", rs.length)}</span>
              <button class="btn btn-primary btn-sm" data-new><i class="fa-solid fa-plus"></i> ${t("resumes.new")}</button></div>
            ${rs.map((m) => {
                        const r = getResume(m.id); if (!r) return "";
                        return `<div class="card resume-row">
                <div class="nm">${esc(r.name || t("common.untitled"))}</div>
                ${r.role ? `<div>${esc(r.role)}</div>` : ""}
                <div class="meta">${updatedText(r.updatedAt)}</div>
                <div class="btnrow">
                  <button class="btn btn-sm" data-open="${r.id}"><i class="fa-solid fa-pen"></i> ${t("common.edit")}</button>
                  <button class="btn btn-sm" data-pv="${r.id}"><i class="fa-solid fa-eye"></i> ${t("common.preview")}</button>
                  <button class="btn btn-sm btn-danger" data-del="${r.id}"><i class="fa-solid fa-trash-can"></i></button>
                </div></div>`;
                    }).join("")}
            ${installCard()}
            <p class="footer-note">${t("home.localOnly")}</p>`;
                },
                bind() {
                    $("#app").addEventListener("click", (e) => {
                        if (e.target.closest("[data-new]")) { newResume(); return; }
                        if (e.target.closest("[data-install]")) { promptInstall(); return; }
                        if (e.target.closest("[data-install-hide]")) { hideInstall(); return; }
                        const open = e.target.closest("[data-open]");
                        if (open) { draft = null; setActive(open.dataset.open); navigate("/form"); return; }
                        const pv = e.target.closest("[data-pv]");
                        if (pv) { draft = null; setActive(pv.dataset.pv); navigate("/preview"); return; }
                        const del = e.target.closest("[data-del]");
                        if (del && confirm(t("resumes.confirmDelete"))) { delResume(del.dataset.del); renderRoute(); }
                    });
                },
            };
        }

        /* ================================================================
           screens: secondary pages, opened from the "More" sidebar.
           Long-form copy lives in content.js, in both languages.
        ================================================================ */
        const SITE = SiteContent.SITE;
        const doc = (key) => (SiteContent.CONTENT[LANG] || SiteContent.CONTENT.en)[key];

        /* Support page: the ways to help are rendered from whatever links are
           configured in content.js, so empty ones simply disappear. */
        function ScreenSupport() {

                html() {

        /* Toggle a bullet marker on the line the caret sits on. */
        function toggleBullet(ta) {
            if (!ta) return;
            const v = ta.value;
            const pos = ta.selectionStart == null ? v.length : ta.selectionStart;
            const lineStart = v.lastIndexOf("\n", Math.max(0, pos - 1)) + 1;
            const nl = v.indexOf("\n", lineStart);
            const lineEnd = nl === -1 ? v.length : nl;
            const line = v.slice(lineStart, lineEnd);
            const existing = /^(\s*)[-*•‣·]\s/.exec(line);
            if (existing) {                                   // already a bullet -> un-bullet it
                ta.value = v.slice(0, lineStart) + line.slice(existing[0].length) + v.slice(lineEnd);
                const caret = Math.max(lineStart, pos - existing[0].length);
                ta.selectionStart = ta.selectionEnd = caret;
            } else {                                          // add the marker at line start
                ta.value = v.slice(0, lineStart) + "• " + v.slice(lineStart);
                ta.selectionStart = ta.selectionEnd = pos + 2;
            }
            ta.focus();
            ta.dispatchEvent(new Event("input", { bubbles: true })); // reuse save + data binding

        function bindForm() {
            const app = $("#app");

            app.addEventListener("input", (e) => {
                const el = e.target;
                if (el.dataset.f) {
                    const v = el.value;
                    if (/\.tags$/.test(el.dataset.f))
                        setPath(R, el.dataset.f, v.split(",").map((s) => s.trim()).filter(Boolean));
                    else if (el.dataset.f === "skills")
                        R.skills = v.split(",").map((s) => s.trim()).filter(Boolean);
                    else setPath(R, el.dataset.f, v);
                    scheduleSave();

                    /* typing in an icon field filters its own suggestions */
                    const wrap = el.closest(".iconpick");
                    if (wrap) {
                        const menu = wrap.querySelector(".iconpick-menu");
                        if (menu.hidden) openIconMenu(wrap, v);
                        else menu.innerHTML = iconMenuHtml(wrap.dataset.iconset, v, v.trim());
                    }
                }
                if (el.id === "photoFile" && el.files[0]) {
                    const fr = new FileReader();
                    fr.onload = () => { R.photo = fr.result; saveNow(); rerenderForm(); };
                    fr.readAsDataURL(el.files[0]);
                }
            });

            /* Focusing an icon field opens its picker so the icons can be browsed. */
            app.addEventListener("focusin", (e) => {
                const wrap = e.target.closest && e.target.closest(".iconpick");
                if (wrap && e.target.matches("input[data-f]") && !wrap.classList.contains("open")) {
                    closeIconMenus(wrap);
                    openIconMenu(wrap);
                    e.target.select(); // typing then replaces the name instead of appending to it
                }
            });

            app.addEventListener("click", (e) => {
                if (e.target.closest("[data-back]")) { saveNow(); navigate("/"); return; }
                if (e.target.closest("[data-topv]")) { saveNow(); navigate("/preview"); return; }

                /* --- icon picker --- */
                const icon = e.target.closest(".iconpick-item");
                if (icon) {
                    const wrap = icon.closest(".iconpick");
                    const input = wrap.querySelector("input[data-f]");
                    input.value = icon.dataset.icon;
                    input.dispatchEvent(new Event("input", { bubbles: true })); // reuse save + binding
                    saveNow();          // picking is a discrete choice — persist it now, not on a debounce
                    closeIconMenus();
                    return;
                }
                const toggle = e.target.closest(".iconpick-toggle");
                if (toggle) {
                    const wrap = toggle.closest(".iconpick");
                    const wasOpen = wrap.classList.contains("open");
                    closeIconMenus();
                    if (!wasOpen) { openIconMenu(wrap); wrap.querySelector("input[data-f]").focus(); }
                    return;
                }

                const btn = e.target.closest("[data-act]");
                if (!btn) return;
                const { act, k } = btn.dataset, i = +btn.dataset.i;

                /* Bullets must not re-render: that would blur the textarea and lose the caret. */
                if (act === "bullet") {
                    toggleBullet(document.querySelector(`[data-f="${CSS.escape(k)}"]`));
                    saveNow();
                    return;
                }

                if (act === "add") { (R[k] ||= []).push(FACTORY[k]()); }
                if (act === "del") { R[k].splice(i, 1); }
                if (act === "add-line") { getPath(R, k).push(""); }
                if (act === "del-line") { const [sec, idx] = k.split("."); R[sec][+idx].lines.splice(i, 1); }
                saveNow(); rerenderForm();
            });

            /* Keyboard support for the icon picker */
            app.addEventListener("keydown", (e) => {
                const wrap = e.target.closest && e.target.closest(".iconpick");
                if (!wrap) return;
                const menu = wrap.querySelector(".iconpick-menu");
                const input = wrap.querySelector("input[data-f]");

                if (e.key === "Escape") { closeIconMenus(); input.focus(); return; }
                if (e.key === "ArrowDown" && e.target === input) {
                    e.preventDefault();
                    if (menu.hidden) openIconMenu(wrap);
                    const first = menu.querySelector(".iconpick-item");
                    if (first) first.focus();
                    return;
                }
                if (!e.target.classList.contains("iconpick-item")) return;
                const items = [...menu.querySelectorAll(".iconpick-item")];
                const at = items.indexOf(e.target);
                const cols = items.filter((el) => el.offsetTop === items[0].offsetTop).length || 1;
                const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
                if (step === undefined) return;
                const next = items[at + step];
                if (next) { e.preventDefault(); next.focus(); }
            });
        }

        /* Rebuild the form without stacking listeners on #app.
           The node is replaced (same trick mount() uses) so the previous
           handlers die with it — otherwise every add/remove would multiply
           the entries it creates, and the <details> state is carried over
           so the "More options" panel no longer snaps shut. */
        function rerenderForm() {
            scrollY = window.scrollY;
            const panel = document.querySelector("#app details.more");
            if (panel) moreOpen = panel.open; // remember before the old DOM goes away
            const old = $("#app");
            const app = old.cloneNode(false); // empty node, same id, zero listeners
            old.parentNode.replaceChild(app, old);
            app.innerHTML = ScreenForm().html();
            bindForm();
            document.querySelectorAll("#app details.more").forEach((d) => { d.open = moreOpen; });
            window.scrollTo(0, scrollY);
        }

        function scheduleSave() {
            $("#saveState") && ($("#saveState").textContent = "…");
            clearTimeout(saveT);
            saveT = setTimeout(saveNow, 500);
        }
        function saveNow() {
            if (!R) return;
            /* A brand-new resume that is still empty stays in memory: "New"
               must not leave blank entries behind in the list. */
            if (draft && isBlank(R)) { const s = $("#saveState"); if (s) s.textContent = t("form.saved"); return; }
            putResume(R);
            setActive(R.id);
            draft = null;
            const s = $("#saveState");
            if (s) s.textContent = t("form.saved");
        }

        /* ================================================================
           templates — presentation only. Switching one changes how the
           same resume data is drawn, never the data itself.
        ================================================================ */
        /* The three groups are different optimisation targets, shown side by
           side — never as a ranking. */
        function templateGroups(activeId) {
            return RenderResume.TEMPLATE_TYPES.map((group) => `

              </div>
              <div class="tpl-row">
                ${RenderResume.templatesOfType(group.key).map((id) => {
                    const tpl = RenderResume.TEMPLATES[id];
                    const on = id === activeId;
                    return `<button type="button" class="tpl-card ${on ? "on" : ""}"
                                    data-template="${id}" aria-pressed="${on}">
                      <span class="tpl-name">${esc(tpl.name)}${
                        on ? ` <span class="tpl-badge">${t("templates.current")}</span>` : ""}</span>
                      <span class="tpl-desc">${esc(t(tpl.descKey))}</span>
                    </button>`;
                }).join("")}
              </div>
            </div>`).join("");
        }

        /* Switching a template is presentation-only: the resume object is the
           same one, so nothing has to be re-entered. */
        function setTemplate(key) {
            const r = currentResume();
            r.template = RenderResume.normalizeTemplate(key);
            if (!draft) putResume(r); // drafts stay unsaved until they have content
            tplPickerOpen = false;
            renderRoute();            // redraws the preview with the new template
        }

        /* ================================================================
           screen: new — template first, then the form
        ================================================================ */
        function ScreenNew() {
            return {
                html() {
                    return `
            <div class="screen-head">
              <button class="iconbtn" data-back aria-label="${esc(t("common.back"))}"><i class="fa-solid fa-arrow-left"></i></button>
              <h1>${t("templates.title")}</h1>
            </div>
            <p class="tpl-hint">${t("templates.hint")}</p>
            ${templateGroups("")}`;
                },
                bind() {
                    $("#app").addEventListener("click", (e) => {
                        if (e.target.closest("[data-back]")) { navigate("/"); return; }
                        const card = e.target.closest("[data-template]");
                        if (card) startResume(card.dataset.template);
                    });
                },
            };
        }

        /* ================================================================
           screen: preview
        ================================================================ */
        let resizeBound = false;
        function ScreenPreview() {
            return {
                html() {
                    const r = currentResume();
                    if (!r) return `<div class="screen-head"><h1>${t("preview.title")}</h1></div>
            <div class="card"><div class="empty">${t("preview.empty")}
              <div style="margin-top:14px"><button class="btn btn-primary" data-mk>${t("preview.create")}</button></div></div></div>`;
                    return `
            <div class="screen-head">
              <button class="iconbtn" data-back><i class="fa-solid fa-arrow-left"></i></button>
              <h1>${t("preview.title")}</h1>
              <button class="btn btn-sm" data-edit><i class="fa-solid fa-pen"></i> ${t("common.edit")}</button>
              <button class="btn btn-primary btn-sm" data-pdf><i class="fa-solid fa-file-pdf"></i> ${t("common.pdf")}</button>
            </div>
            <button type="button" class="btn btn-sm tpl-toggle ${tplPickerOpen ? "on" : ""}"
                    data-toggle-tpl aria-expanded="${tplPickerOpen}">
              <i class="fa-solid fa-table-cells-large"></i>
              <span>${t("templates.change")}: <b>${esc(RenderResume.TEMPLATES[
                RenderResume.normalizeTemplate(r.template)].name)}</b></span>
              <i class="fa-solid fa-chevron-${tplPickerOpen ? "up" : "down"} tpl-toggle-caret"></i>
            </button>
            ${tplPickerOpen ? `<div class="tpl-panel">${templateGroups(RenderResume.normalizeTemplate(r.template))}</div>` : ""}
            <div class="pv-holder" id="pvHolder"><div id="pvScale"><iframe id="pv" title="${esc(t("preview.title"))}"></iframe></div></div>
            <p class="footer-note">${t("preview.note")}</p>`;
                },
                bind() {
                    const r = currentResume();
                    const app = $("#app");
                    app.addEventListener("click", (e) => {
                        if (e.target.closest("[data-back]")) navigate("/");
                        if (e.target.closest("[data-mk]")) { newResume(); }
                        if (e.target.closest("[data-edit]")) navigate("/form");
                        if (e.target.closest("[data-pdf]")) printResume();
                        if (e.target.closest("[data-toggle-tpl]")) { tplPickerOpen = !tplPickerOpen; renderRoute(); return; }
                        const tpl = e.target.closest("[data-template]");
                        if (tpl) setTemplate(tpl.dataset.template);
                    });
                    if (!r) return;

                    const pv = $("#pv");
                    const fit = () => {
                        const holder = $("#pvHolder"), sc = $("#pvScale"), frame = $("#pv");
                        if (!holder || !sc || !frame) return;
                        const h = +(frame.dataset.h || 1123);          // measured doc height, fallback A4
                        const s = Math.min(1, holder.clientWidth / 794);
                        frame.style.height = h + "px";                 // ← the actual fix
                        sc.style.width = "794px";
                        sc.style.height = h + "px";
                        sc.style.transform = `scale(${s})`;
                        holder.style.height = h * s + "px";
                    };
                    pv.addEventListener("load", async () => {
                        try {
                            const doc = pv.contentDocument;
                            if (doc && doc.defaultView) {
                                // wait for webfonts + the template's auto-fit before measuring,
                                // so the height is captured after final layout, not mid-load
                                await (doc.fonts ? doc.fonts.ready : Promise.resolve());
                                if (doc.defaultView.__layoutReady) await doc.defaultView.__layoutReady;
                                pv.dataset.h = Math.max(1123, doc.body.scrollHeight);
                            }
                        } catch { }
                        fit();
                    });
                    pv.srcdoc = RenderResume.render(merged(r));
                    fit(); // immediate paint at A4 height; refined when load fires
                    if (!resizeBound) { addEventListener("resize", () => { if ($("#pvHolder")) fit(); }); resizeBound = true; }
                },
            };
        }

        /* ================================================================
           screen: settings (global — applies to all resumes)
        ================================================================ */
        function ScreenSettings() {
            return {
                html() {
                    const s = getSettings();
                    const fontRow = (key) => `
            <div class="fontopt ${s.font === key ? "on" : ""}" data-font="${key}">
              <span>${FONTS[key].label}</span>
              <span class="sample" style="font-family:${FONTS[key].stack}">Aa</span>
            </div>`;
                    const swatches = (name, presets) => `
            <div class="swatches" data-set="${name}">
              ${presets.map((c) => `<button class="swatch ${s[name] === c ? "on" : ""}" style="background:${c}" data-val="${c}" title="${c}"></button>`).join("")}
              <input type="color" value="${s[name]}" data-color="${name}" title="Custom">
            </div>`;
                    return `
            <div class="screen-head"><h1>${t("settings.title")}</h1></div>
            <div class="card"><h2>${t("settings.language")}</h2>
              ${I18n.LANGS.map((l) => `
              <div class="fontopt ${LANG === l.code ? "on" : ""}" data-lang="${l.code}">
                <span>${esc(l.label)}</span>
                <span class="head-sub">${esc(l.code.toUpperCase())}</span>
              </div>`).join("")}
              <p class="footer-note" style="margin-top:10px">${t("settings.languageNote")}</p>
            </div>
            <div class="card"><h2>${t("settings.font")}</h2>${Object.keys(FONTS).map(fontRow).join("")}</div>
            <div class="card"><h2>${t("settings.accent")}</h2>${swatches("accent", ACCENT_PRESETS)}</div>
            <div class="card"><h2>${t("settings.sideBg")}</h2>${swatches("sideBg", SIDE_PRESETS)}</div>
            <div class="card"><h2>${t("settings.layout")}</h2>
              <label style="display:flex;gap:10px;align-items:center">
                <input type="checkbox" id="multipage" ${s.multipage ? "checked" : ""}>
                <span>${t("settings.multipage")}</span>
              </label>
            </div>
            <div class="card"><h2>${t("settings.support")}</h2>
              <p class="footer-note" style="text-align:left;margin:0 0 10px">${t("settings.supportNote")}</p>
              <button class="btn btn-block" data-goto="/support">
                <i class="fa-solid fa-mug-hot"></i> ${t("drawer.support")}</button>
              ${canInstall() ? `<button class="btn btn-block" style="margin-top:8px" data-install>
                <i class="fa-solid fa-mobile-screen"></i> ${t("install.action")}</button>` : ""}
            </div>
            <div class="card"><h2>${t("settings.reset")}</h2>
              <button class="btn btn-danger btn-block" id="btnResetSettings">
                <i class="fa-solid fa-rotate-left"></i> ${t("settings.resetBtn")}</button>
              <p class="footer-note">${t("settings.resetNote")}</p>
            </div>`;
                },
                bind() {
                    const app = $("#app");
                    const s = getSettings();
                    app.addEventListener("click", (e) => {
                        const goTo = e.target.closest("[data-goto]");
                        if (goTo) { navigate(goTo.dataset.goto); return; }
                        if (e.target.closest("[data-install]")) { promptInstall(); return; }
                        const lang = e.target.closest("[data-lang]");
                        if (lang && lang.dataset.lang !== LANG) { setLang(lang.dataset.lang); toast(t("settings.langDone")); return; }
                        const f = e.target.closest("[data-font]");
                        if (f) { saveSettings({ ...s, font: f.dataset.font }); renderRoute(); }
                        const sw = e.target.closest(".swatch[data-val]");
                        if (sw) { saveSettings({ ...s, [sw.parentElement.dataset.set]: sw.dataset.val }); renderRoute(); }
                        const rs = e.target.closest("#btnResetSettings");
                        if (rs && confirm(t("settings.confirmReset"))) {
                            saveSettings({ ...DEFAULT_SETTINGS }); renderRoute(); toast(t("settings.resetDone"));
                        }
                    });
                    app.addEventListener("input", (e) => {
                        if (e.target.dataset.color) saveSettings({ ...s, [e.target.dataset.color]: e.target.value });
                        if (e.target.id === "multipage") saveSettings({ ...s, multipage: e.target.checked });
                    });
                },
            };
        }

        /* ================================================================
           screen: account (local profile + data management)
        ================================================================ */
        function ScreenAccount() {
            return {
                html() {
                    const a = getAccount();
                    return `
            <div class="screen-head"><h1>${t("account.title")}</h1></div>
            <div class="card"><h2>${t("account.profile")}</h2>
              <div class="head-sub" style="margin-bottom:10px">${t("account.profileNote")}</div>
              ${fieldLocal(t("account.name"), "name", a.name)}
              ${fieldLocal(t("account.email"), "email", a.email)}
            </div>
            <div class="card"><h2>${t("account.data")}</h2>
              <div class="btnrow" style="margin-bottom:10px">
                <button class="btn btn-sm" id="btnExport"><i class="fa-solid fa-download"></i> ${t("account.export")}</button>
                <label class="btn btn-sm" style="margin:0"><i class="fa-solid fa-upload"></i> ${t("account.import")}
                  <input type="file" accept="application/json" id="importFile" hidden></label>
              </div>
              <button class="btn btn-danger btn-block" id="btnWipe">
                <i class="fa-solid fa-triangle-exclamation"></i> ${t("account.wipe")}</button>
              <p class="footer-note">${t("account.privacy")}</p>
            </div>`;
                },
                bind() {
                    const app = $("#app");
                    const a = getAccount();
                    let accT;
                    app.addEventListener("input", (e) => {
                        if (e.target.dataset.acc) {
                            a[e.target.dataset.acc] = e.target.value;
                            clearTimeout(accT); accT = setTimeout(() => saveAccount(a), 400);
                        }
                    });
                    $("#btnExport").addEventListener("click", () => {
                        const data = {
                            version: 2, account: getAccount(), settings: getSettings(),
                            resumes: listResumes().map((m) => getResume(m.id))
                        };
                        const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
                        const el = document.createElement("a");
                        el.href = url; el.download = "resumes-backup.json"; el.click();
                        URL.revokeObjectURL(url);
                    });
                    $("#importFile").addEventListener("change", (e) => {
                        const f = e.target.files[0]; if (!f) return;
                        const fr = new FileReader();
                        fr.onload = () => {
                            try {
                                const d = JSON.parse(fr.result);
                                if (!Array.isArray(d.resumes)) throw new Error("bad file");
                                (d.resumes || []).forEach((r) => r && r.id && putResume(normalize(r)));
                                if (d.account) saveAccount(d.account);
                                if (d.settings) saveSettings({ ...DEFAULT_SETTINGS, ...d.settings });
                                toast(t("account.imported")); navigate("/");
                            } catch (err) { toast(t("account.importFailed", { msg: err.message })); }
                        };
                        fr.readAsText(f);
                    });
                    $("#btnWipe").addEventListener("click", () => {
                        if (!confirm(t("account.confirmWipe"))) return;
                        Object.keys(localStorage).filter((k) => k.startsWith("rr:")).forEach((k) => localStorage.removeItem(k));
                        localStorage.removeItem("resume-data"); // old key too
                        toast(t("account.wiped")); navigate("/");
                    });
                },
            };
        }
        const fieldLocal = (label, key, val) =>
            `<div class="field"><label>${label}</label>
       <input class="input" data-acc="${key}" value="${esc(val)}"></div>`;

        /* ================================================================
           boot
        ================================================================ */
        applyI18n();
        renderRoute();

        /* Offline support + installability. Needs https (or localhost); it is
           simply skipped when the file is opened directly from disk. */
        if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
            addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch((err) =>
                    console.warn("[sw] registration failed:", err.message));
            });
        }
    </script>
</body>

</html>
